# Alembic Configuration File
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migrations directory (relative to this file)
script_location = migrations

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Prepend sys.path with this path so 'app' is importable
prepend_sys_path = .

# SQLAlchemy URL — overridden in env.py from ALEMBIC_DATABASE_URL env var
sqlalchemy.url = postgresql+psycopg2://namma:changeme@postgres:5432/namma_exodus

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
