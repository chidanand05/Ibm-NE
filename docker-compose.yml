version: "3.9"

# Namma Exodus — Docker Compose Development Stack
# Services: postgres, redis, chromadb, backend, crowd-sim-mcp, frontend, jaeger
#
# Usage:
#   cp .env.example .env          # Fill in your API keys
#   docker-compose up --build     # Build and start all services
#   docker-compose up -d          # Start in background after first build
#
# Note: LiteLLM runs as a Python library INSIDE the backend container — it is NOT a separate service.
# Note: chromadb and crowd-sim-mcp are internal-only (no host port mapping).

networks:
  namma-exodus-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:

services:

  # ─── PostgreSQL 16 + PostGIS 3.4 ──────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: namma-exodus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-namma_exodus}
      POSTGRES_USER: ${POSTGRES_USER:-namma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - namma-exodus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namma} -d ${POSTGRES_DB:-namma_exodus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: namma-exodus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - namma-exodus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB (internal only — no host port mapping) ────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: namma-exodus-chromadb
    restart: unless-stopped
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
    volumes:
      - chroma_data:/chroma/chroma
    # Port 8000 is internal only — backend accesses via http://chromadb:8000
    expose:
      - "8000"
    networks:
      - namma-exodus-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Crowd Simulation MCP Server (Streamable HTTP, internal only) ────────────
  crowd-sim-mcp:
    build:
      context: ./mcp_servers/crowd_sim_mcp
      dockerfile: Dockerfile
    container_name: namma-exodus-crowd-sim-mcp
    restart: unless-stopped
    # Port 8001 is internal only — backend accesses via http://crowd-sim-mcp:8001/mcp
    expose:
      - "8001"
    networks:
      - namma-exodus-network
    healthcheck:
      test: ["CMD-SHELL", "echo stub-healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: namma-exodus-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      crowd-sim-mcp:
        condition: service_started
    networks:
      - namma-exodus-network

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: namma-exodus-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - namma-exodus-network

  # ─── Jaeger All-in-One (Distributed Tracing) ─────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: namma-exodus-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    networks:
      - namma-exodus-network
